openapi: 3.0.3
info:
  title: PTM External API
  description: |
    Универсальный внешний REST API Public Trade Module (1С 8.3.27).

    **Source of truth** после freeze. Детали решений: `METHODS-v1.md`, `ADR-001-REST-OpenAPI.md`.

    ## Правила
    - Один list-метод на ресурс; фильтры — query (AND).
    - Пагинация: `limit` (default 100, max 1000), `offset`.
    - Path `/{id}` — только UUID.
    - Период `dateFrom`+`dateTo` обязателен для `/sales` и всех document-list.
    - Max период одного запроса: **31 день**; длиннее → `400 period_too_long` (клиент бьёт на несколько запросов).
    - Документы: `detail=header|full` (list default header; get-by-id default full).
    - Регистры — primary; документы — secondary.
    - Auth: `X-Api-Key` (кроме `/health`).
  version: 1.0.0
  contact:
    name: PTM

servers:
  - url: http://localhost/PTM_Clean/hs/ptm/v1
    description: Local DEV (Apache /PTM_Clean)
  - url: /hs/ptm/v1
    description: Relative to 1C publication

tags:
  - name: health
  - name: products
    description: Справочник Номенклатура
  - name: warehouses
  - name: cash-registers
  - name: counterparties
  - name: price-types
  - name: barcodes
    description: РС Штрихкоды
  - name: prices
    description: РС ЦеныНоменклатуры (slice / history)
  - name: stocks
    description: РН ОстаткиТоваров (primary)
  - name: sales
    description: РН Продажи (primary, period required)
  - name: cash-balances
  - name: settlements
  - name: goods-receipts
    description: Документ ПриходТовара (secondary)
  - name: write-offs
  - name: inventories
  - name: repricings
  - name: cash-in
  - name: cash-out
  - name: receipts
    description: Документ ЧекККМ (secondary read)

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

