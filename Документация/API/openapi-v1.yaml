components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

  headers:
    X-Request-Id:
      description: Correlation id (echo or generated)
      schema:
        type: string
        format: uuid

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid

    IdPath:
      name: id
      in: path
      required: true
      description: Object UUID only
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    FilterId:
      name: id
      in: query
      schema: { type: string, format: uuid }

    FilterCode:
      name: code
      in: query
      schema: { type: string }

    FilterName:
      name: name
      in: query
      schema: { type: string }

    FilterDeletionMark:
      name: deletionMark
      in: query
      schema: { type: boolean, default: false }

    ProductId:
      name: productId
      in: query
      schema: { type: string, format: uuid }

    ProductCode:
      name: productCode
      in: query
      schema: { type: string }

    WarehouseId:
      name: warehouseId
      in: query
      schema: { type: string, format: uuid }

    WarehouseCode:
      name: warehouseCode
      in: query
      schema: { type: string }

    CashRegisterId:
      name: cashRegisterId
      in: query
      schema: { type: string, format: uuid }

    CashRegisterCode:
      name: cashRegisterCode
      in: query
      schema: { type: string }

    DateFromRequired:
      name: dateFrom
      in: query
      required: true
      description: Period start (inclusive). With dateTo max 31 days.
      schema:
        type: string
        format: date-time

    DateToRequired:
      name: dateTo
      in: query
      required: true
      description: Period end (inclusive). With dateFrom max 31 days.
      schema:
        type: string
        format: date-time

    DateFromOptional:
      name: dateFrom
      in: query
      description: History mode when both dateFrom and dateTo set (max 31 days)
      schema:
        type: string
        format: date-time

    DateToOptional:
      name: dateTo
      in: query
      schema:
        type: string
        format: date-time

    Detail:
      name: detail
      in: query
      description: header = header only; full = header + tabular sections
      schema:
        type: string
        enum: [header, full]
        default: header

    DetailOptional:
      name: detail
      in: query
      description: Default full for GET by id
      schema:
        type: string
        enum: [header, full]
        default: full


  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "1.0.0"
        time:
          type: string
          format: date-time

    ListMeta:
      type: object
      required: [items, count, limit, offset]
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          nullable: true

    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: |
            Stable codes include: period_required, period_invalid, period_too_long,
            validation_error, unauthorized, not_found, internal_error
          example: period_required
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true

    Product:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        article: { type: string }
        unit: { type: string }
        vatRate: { type: string }
        taxGroupId: { type: string, format: uuid }
        codeUKTZED: { type: string }
        requiresExciseStamp: { type: boolean }
        markupPercent: { type: number }
        parentId: { type: string, format: uuid, nullable: true }
        isFolder: { type: boolean }
        deletionMark: { type: boolean }
        barcodes:
          type: array
          items: { type: string }

    ProductListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Product"

    Warehouse:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        deletionMark: { type: boolean }

    WarehouseListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Warehouse"

    CashRegister:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        deletionMark: { type: boolean }

    CashRegisterListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CashRegister"

    Counterparty:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        isFolder: { type: boolean }
        deletionMark: { type: boolean }

    CounterpartyListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Counterparty"

    PriceType:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        deletionMark: { type: boolean }

    PriceTypeListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PriceType"

    BarcodeRow:
      type: object
      required: [barcode, productId]
      properties:
        barcode: { type: string }
        productId: { type: string, format: uuid }
        productCode: { type: string }
        productName: { type: string }

    BarcodeListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BarcodeRow"

    PriceRow:
      type: object
      required: [productId, price]
      properties:
        productId: { type: string, format: uuid }
        productCode: { type: string }
        priceTypeId: { type: string, format: uuid }
        priceTypeCode: { type: string }
        price: { type: number }
        period: { type: string, format: date-time }
        recorderId: { type: string, format: uuid, nullable: true }

    PriceListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PriceRow"

    StockRow:
      type: object
      required: [productId, warehouseId, quantity]
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseCode: { type: string }
        productId: { type: string, format: uuid }
        productCode: { type: string }
        quantity: { type: number }
        onDate: { type: string, format: date-time }

    StockListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StockRow"

    SaleRow:
      type: object
      required: [productId, quantity, amount]
      properties:
        productId: { type: string, format: uuid }
        productCode: { type: string }
        cashRegisterId: { type: string, format: uuid }
        cashRegisterCode: { type: string }
        shiftId: { type: string, format: uuid, nullable: true }
        employeeId: { type: string, format: uuid, nullable: true }
        quantity: { type: number }
        amount: { type: number }
        cost: { type: number }
        period: { type: string, format: date-time }

    SaleListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SaleRow"

    CashBalanceRow:
      type: object
      required: [cashRegisterId, amount]
      properties:
        cashRegisterId: { type: string, format: uuid }
        cashRegisterCode: { type: string }
        amount: { type: number }
        onDate: { type: string, format: date-time }

    CashBalanceListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CashBalanceRow"

    SettlementRow:
      type: object
      required: [counterpartyId, amount]
      properties:
        counterpartyId: { type: string, format: uuid }
        counterpartyCode: { type: string }
        documentId: { type: string, format: uuid, nullable: true }
        amount: { type: number }
        onDate: { type: string, format: date-time }

    SettlementListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SettlementRow"

    DocumentHeader:
      type: object
      required: [id, number, date, posted]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        date: { type: string, format: date-time }
        posted: { type: boolean }
        deletionMark: { type: boolean }
        warehouseId: { type: string, format: uuid, nullable: true }
        warehouseCode: { type: string }
        counterpartyId: { type: string, format: uuid, nullable: true }
        counterpartyCode: { type: string }
        cashRegisterId: { type: string, format: uuid, nullable: true }
        amount: { type: number }
        comment: { type: string }

    DocumentLine:
      type: object
      properties:
        lineNumber: { type: integer }
        productId: { type: string, format: uuid }
        productCode: { type: string }
        quantity: { type: number }
        price: { type: number }
        amount: { type: number }

    GoodsReceipt:
      allOf:
        - $ref: "#/components/schemas/DocumentHeader"
        - type: object
          properties:
            lines:
              type: array
              description: Present when detail=full
              items:
                $ref: "#/components/schemas/DocumentLine"

    WriteOff:
      allOf:
        - $ref: "#/components/schemas/DocumentHeader"
        - type: object
          properties:
            lines:
              type: array
              items:
                $ref: "#/components/schemas/DocumentLine"

    Inventory:
      allOf:
        - $ref: "#/components/schemas/DocumentHeader"
        - type: object
          properties:
            lines:
              type: array
              items:
                $ref: "#/components/schemas/DocumentLine"

    Repricing:
      allOf:
        - $ref: "#/components/schemas/DocumentHeader"
        - type: object
          properties:
            priceTypeId: { type: string, format: uuid }
            lines:
              type: array
              items:
                $ref: "#/components/schemas/DocumentLine"

    CashDocument:
      allOf:
        - $ref: "#/components/schemas/DocumentHeader"
        - type: object
          properties:
            lines:
              type: array
              items:
                type: object
                additionalProperties: true

    Receipt:
      allOf:
        - $ref: "#/components/schemas/DocumentHeader"
        - type: object
          properties:
            shiftId: { type: string, format: uuid, nullable: true }
            status: { type: string }
            items:
              type: array
              description: Present when detail=full
              items:
                $ref: "#/components/schemas/DocumentLine"
            payments:
              type: array
              description: Present when detail=full
              items:
                type: object
                properties:
                  type: { type: string }
                  amount: { type: number }

    GoodsReceiptListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/GoodsReceipt"

    WriteOffListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WriteOff"

    InventoryListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Inventory"

    RepricingListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Repricing"

    CashInListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CashDocument"

    CashOutListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CashDocument"

    ReceiptListResponse:
      allOf:
        - $ref: "#/components/schemas/ListMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Receipt"

  responses:
    BadRequest:
      description: |
        Validation / period errors.
        Codes: period_required, period_invalid, period_too_long, validation_error
      headers:
        X-Request-Id:
