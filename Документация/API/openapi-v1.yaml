        - name: article
          in: query
          schema: { type: string }
        - name: barcode
          in: query
          schema: { type: string }
        - name: name
          in: query
          description: Substring match
          schema: { type: string }
        - name: groupId
          in: query
          schema: { type: string, format: uuid }
        - name: isFolder
          in: query
