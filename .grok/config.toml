# Сгенерировано: python scripts/_generate_mcp.py
# Grok читает из <git-root>/.grok/config.toml

[skills]
paths = [".github/skills"]

[mcp_servers."context-mcp"]
command = "D:/Git/Public_Trade_Module/.venv/Scripts/python.exe"
args = [
  "D:/Git/Public_Trade_Module/scripts/context_mcp_server.py"
]
env = { PYTHONPATH = "D:/Git/Public_Trade_Module", PYTHONIOENCODING = "utf-8" }
