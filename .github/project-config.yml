# ═══════════════════════════════════════════════════════════════════════════════
# Конфигурация проекта 1С для Copilot Agent Framework
# ═══════════════════════════════════════════════════════════════════════════════
# Единственный файл, который нужно заполнить при подключении фреймворка к новому проекту.
# Все агенты, скиллы и скрипты читают настройки отсюда.
#
# Как подключить к новому проекту:
#   1. Скопировать .github/ и scripts/ в корень нового проекта
#   2. Заполнить этот файл
#   3. Выполнить deploy-config.ps1 -Action Dump для выгрузки конфигурации
# ═══════════════════════════════════════════════════════════════════════════════

project:
  name: "PTM"                                    # Короткое имя (для логов, тегов)
  full_name: "Public Trade Module"               # Полное название
  platform: "8.3.27"                             # Версия платформы 1С

# ── Пути ──────────────────────────────────────────────────────────────────────
paths:
  infobase: "D:\\Confiq\\Public Trade Module"    # Путь к файловой ИБ
  apache_publication: "D:\\Apache\\Module_Torgovly_DEV"  # Каталог публикации Apache (default.vrd)
  config_root: "Конфигурация"                    # Папка выгрузки (относительно корня проекта)
  backups: "_backups"                            # Папка локальных бэкапов
  docs: "Документация"                           # Папка документации
  validation: "Документация/Валидация"           # PowerShell скрипты деплоя
  standards: "Документация/Технические_стандарты" # Стандарты 1С
  templates: "Документация/Шаблоны"              # XML-шаблоны
  tests: "Тесты"                                 # Папка тестов

# ── MCP серверы (ОТДЕЛЬНО ДЛЯ КАЖДОГО ПРОЕКТА 1С) ─────────────────────────────
# Скрипты MCP лежат в scripts/ ЭТОГО репозитория. Не подключать MCP другого проекта.
# После правок: python scripts/_generate_mcp.py → .mcp.json / .cursor/mcp.json / .grok/config.toml
# Каждый stdio-сервер читает пути из project-config.yml и config.json текущего проекта.
mcp:

  # 1С HTTP MCP — проверка метаданных ИБ, инспекция объектов
  onec:
    prefix: "mcp_1c"
    health_check: "get_session_info"
    # base из default.vrd: /PTM_Clean (каталог Apache — paths.apache_publication)
    url: "http://localhost/PTM_Clean/hs/mcp/mcp"
    auth_user: "Admin"
    auth_password: ""

  # Контекст 1С — resolve/get/moc/feedback (scripts/get_context.py)
  context:
    enabled: true

  # Инфраструктура разработки — backup/dump/deploy/sync_obsidian
  dev:
    enabled: true

  # Telegram-дашборд задач (токены из .env)
  tg_dashboard:
    enabled: false

  # Управление Конфигуратором — скриншоты, клики, навигация
  configurator:
    enabled: true

  # RDBG Отладчик BSL
  debug:
    enabled: false
    prefix: "mcp_debug"

  # Obsidian REST MCP — НЕ ИСПОЛЬЗУЕТСЯ (требует постоянно запущенный Obsidian).
  # Vault и граф: dev_sync_obsidian + context-mcp + read_file/create_file по config.json.
  obsidian:
    enabled: false
    prefix: "mcp_obsidian-vaul"
    vault: "ptm-workspace"
    project_folder: "PTM"
    url: "http://localhost:3001/mcp"
    token: ""

  # ModelBench (опционально, только если есть песочница для тестов моделей)
  bench:
    enabled: false
    root: ""                                       # например D:\Git\PTM_ModelBench

# ── Расширения конфигурации ───────────────────────────────────────────────────
extensions:
  - name: "MCP_Сервер"
    dir: "MCP_Extension"                         # Папка выгрузки (относительно корня)
  - name: "PTM_Analytics"
    dir: "Конфигурация_PTM_Analytics"

# ── MCP Resources (опционально) ──────────────────────────────────────────────
resources:
  prefix: "ptm"                                  # Протокол для ресурсов: ptm://datamodel
  available:                                     # Доступные ресурсы (список)
    - "datamodel"                                # Модель данных
    - "registers"                                # Карта регистров
    - "business-logic"                           # Документооборот

# ── Спецификация (опционально) ────────────────────────────────────────────────
spec:
  enabled: true                                  # false — не использовать спецификацию
  path: "Документация/Спецификации/ТЕХНИЧЕСКАЯ СПЕЦИФИКАЦИЯ КОНФИГУРАЦИИ PTM (Public Trade Module).xml"

# ── Мониторинг ────────────────────────────────────────────────────────────────
monitoring:
  backup_prefix: "PTM-backup"                    # Префикс DT-бэкапов
  process_filter: "Public.Trade.Module"          # Фильтр процесса в ТЖ
