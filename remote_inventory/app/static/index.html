<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Удалённый переучёт</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>Переучёт</h1>
  </header>
  <div id="statusBanner" class="banner" style="display:none; margin: 12px 16px 0;"></div>

  <section id="loginScreen" class="screen active">
    <p>Вход на сервер переучёта (не в 1С).</p>
    <form id="loginForm">
      <input id="username" type="text" autocomplete="username" placeholder="Логин" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
      <button type="submit">Войти</button>
    </form>
    <div id="loginError" class="error"></div>
    <p class="meta">Первый вход создаёт учётку, если пользователей ещё нет.</p>
  </section>

  <section id="nameScreen" class="screen">
    <p>Кто считает</p>
    <input id="authorName" type="text" placeholder="Имя">
    <button id="nameGo" type="button">Дальше</button>
    <div id="nameError" class="error"></div>
  </section>

  <section id="whScreen" class="screen">
    <button id="syncBtn" class="secondary" type="button">Синхронизировать с 1С</button>
    <div id="whError" class="error"></div>
    <div id="whList"></div>
  </section>

  <section id="docsScreen" class="screen">
    <button id="backWh" class="secondary" type="button">← Склады</button>
    <h2 id="docsTitle">Черновики</h2>
    <input id="newComment" type="text" placeholder="Участок / отдел">
    <button id="createDoc" type="button">Создать</button>
    <div id="docsError" class="error"></div>
    <div id="docsList"></div>
  </section>

  <section id="docScreen" class="screen">
    <button id="backDocs" class="secondary" type="button">← Список</button>
    <h2 id="docTitle"></h2>
    <div id="docMeta" class="meta"></div>
    <input id="barcodeInput" type="text" inputmode="numeric" placeholder="Штрихкод" autocomplete="off">
    <button id="scanBtn" type="button">Найти</button>
    <div id="docError" class="error"></div>
    <div id="lines"></div>
    <div id="qtyBox" style="display:none">
      <div id="qtyLabel"></div>
      <input id="qtyInput" type="number" inputmode="decimal" step="0.001" min="0" placeholder="Количество">
      <button id="qtySave" type="button">Записать</button>
    </div>
    <button id="deleteDoc" class="danger" type="button">Удалить черновик</button>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
