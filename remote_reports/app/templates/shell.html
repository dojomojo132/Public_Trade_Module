<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="color-scheme" content="light">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=16">
</head>
<body{% if auth %} class="is-auth"{% endif %}>
{% if auth %}
  <div class="auth-shell">
    {{ body | safe }}
  </div>
{% else %}
  <header class="top">
    <a class="brand" href="/">
      <span class="mark">P</span>
      <span class="brand-name">Отчёты PTM</span>
    </a>
    <span class="ib-status" id="ib-status" data-state="{{ ib_state }}">{{ ib_label }}</span>
    <nav class="nav-links">
      <a class="nav-link{% if nav == 'home' %} is-on{% endif %}" href="/">Отчёты</a>
      <a class="nav-link{% if nav == 'inv' %} is-on{% endif %}" href="/inv">Переучёт</a>
      <a class="nav-link{% if nav == 'settings' %} is-on{% endif %}" href="/settings">Настройки</a>
    </nav>
    <div class="nav-user">
      <span class="who">{{ username }}</span>
      <form method="post" action="/logout"><button class="ghost" type="submit">Выйти</button></form>
    </div>
  </header>
  <div class="wrap">
    {{ body | safe }}
  </div>
{% endif %}
  <script>
    (function () {
      var el = document.getElementById("ib-status");
      if (!el) return;
      fetch("/ib-status", { credentials: "same-origin" })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var status = data && data.status ? data.status : "offline";
          el.setAttribute("data-state", status === "ok" ? "online" : status);
          el.textContent = data && data.label ? data.label : status;
        })
        .catch(function () {
          el.setAttribute("data-state", "offline");
          el.textContent = "Офлайн";
        });
    })();
  </script>
</body>
</html>
